name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # Fails the build if a library the hub uses has a known serious vulnerability.
      - name: Check dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  android:
    name: Pupil app (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Optional: if these repository secrets exist, every build is signed
      # with the same key so new versions install over old ones.
      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HUB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hub.jks"
            echo "HUB_KEYSTORE_PATH=$RUNNER_TEMP/hub.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secret set - using a throwaway debug key."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        env:
          HUB_KEYSTORE_PASSWORD: ${{ secrets.HUB_KEYSTORE_PASSWORD }}
          HUB_KEY_ALIAS: ${{ secrets.HUB_KEY_ALIAS }}
          HUB_KEY_PASSWORD: ${{ secrets.HUB_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug

      # Prints the signing certificate. With the school key it should match
      # the SHA-256 fingerprint saved alongside the key.
      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/*.apk | grep -E "DN|SHA-256"
          if [ -z "$HUB_KEYSTORE_PATH" ]; then
            echo "::warning::Signed with a throwaway key: new builds will NOT install over old ones. Add the HUB_* secrets."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: classroom-hub-pupil-apk
          path: android/app/build/outputs/apk/debug/*.apk

  # Trial-only: publish each APK as a GitHub Release so it can be downloaded
  # in Silk on a tablet without a GitHub account. Anyone can download it
  # (it is useless without the hub's setup code). Remove this job, or make
  # the repository private, before any wider or commercial use.
  release:
    name: Publish test release
    needs: [server, android]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: classroom-hub-pupil-apk
          path: apk
      - name: Name the APK
        run: mv apk/*.apk classroom-hub.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: Test build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: classroom-hub.apk
          body: |
            Trial build of the Classroom Hub pupil app, for testing only.

            **Install on a Fire tablet:** open this page in Silk, tap `classroom-hub.apk`, then tap Install.
            Short link to the newest build: https://github.com/${{ github.repository }}/releases/latest/download/classroom-hub.apk

            Built from commit ${{ github.sha }}.
