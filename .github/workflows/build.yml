name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  android:
    name: Pupil app (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Optional: if these repository secrets exist, every build is signed
      # with the same key so new versions install over old ones.
      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HUB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hub.jks"
            echo "HUB_KEYSTORE_PATH=$RUNNER_TEMP/hub.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secret set - using a throwaway debug key."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        env:
          HUB_KEYSTORE_PASSWORD: ${{ secrets.HUB_KEYSTORE_PASSWORD }}
          HUB_KEY_ALIAS: ${{ secrets.HUB_KEY_ALIAS }}
          HUB_KEY_PASSWORD: ${{ secrets.HUB_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: classroom-hub-pupil-apk
          path: android/app/build/outputs/apk/debug/*.apk
